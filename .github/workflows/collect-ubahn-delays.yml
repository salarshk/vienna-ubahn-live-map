name: Collect and validate U-Bahn delay model

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: ubahn-delay-collection
  cancel-in-progress: false

jobs:
  collect_and_train:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      publish_changed: ${{ steps.publish.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore rolling dataset from Cloudflare R2
        id: r2_restore
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/ml/archive_r2.mjs download-ubahn

      - name: Find previous dataset
        id: previous
        if: steps.r2_restore.outputs.r2_restored != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --workflow collect-ubahn-delays.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Restore previous observations
        if: steps.r2_restore.outputs.r2_restored != 'true' && steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: ubahn-delay-data
          path: data/ml
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Import official historical U-Bahn incidents
        run: node scripts/ml/sync_ubahn_incidents.mjs

      - name: Collect one Wiener Linien snapshot
        run: node scripts/ml/collect_ubahn_delays.mjs

      - name: Train preliminary or validated model with a chronological holdout
        env:
          DELAY_MODEL_PATH: data/ml/candidate-model.json
          DELAY_METRICS_PATH: data/ml/candidate-metrics.json
        run: node scripts/ml/train_delay_model.mjs

      - name: Publish daily progress or a new online-model stage
        id: publish
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          today="$(date -u +%F)"
          previous_day="$(cat data/ml/last-published-day.txt 2>/dev/null || true)"
          candidate_online_status="$(node -p "require('./data/ml/candidate-model.json').onlineCalibration?.status || 'missing'")"
          published_online_status="$(node -p "require('./public/ml/delay-model.json').onlineCalibration?.status || 'missing'")"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$today" != "$previous_day" ] || [ "$candidate_online_status" != "$published_online_status" ]; then
            mkdir -p public/ml
            cp data/ml/candidate-model.json public/ml/delay-model.json
            cp data/ml/candidate-metrics.json public/ml/delay-metrics.json
            echo "$today" > data/ml/last-published-day.txt
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save observations for the next run
        uses: actions/upload-artifact@v7
        with:
          name: ubahn-delay-data
          path: data/ml
          retention-days: 7
          compression-level: 9

      - name: Archive observations to Cloudflare R2
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/ml/archive_r2.mjs upload-ubahn

      - name: Commit public model report
        if: steps.publish.outputs.changed == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/ml/delay-model.json public/ml/delay-metrics.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update U-Bahn delay model report"
          git push

  deploy_report:
    needs: collect_and_train
    if: needs.collect_and_train.outputs.publish_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the report commit
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build website with the new report
        run: npx vite build
        env:
          GITHUB_PAGES: 'true'
          VITE_VIENNA_API_BASE: https://corsproxy.nl/https/www.wienerlinien.at/ogd_realtime
          VITE_ADVISOR_API_URL: ${{ vars.ADVISOR_API_URL }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
