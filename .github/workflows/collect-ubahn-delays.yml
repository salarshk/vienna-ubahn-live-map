name: Collect and validate U-Bahn delay model

on:
  push:
    paths:
      - 'scripts/ml/**'
      - '.github/workflows/collect-ubahn-delays.yml'
  schedule:
    # Cloudflare Worker owns the five-minute edge snapshots. GitHub Actions
    # restores those archives and performs the heavier daily training.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ubahn-delay-collection
  cancel-in-progress: false

jobs:
  collect_and_train:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      publish_changed: ${{ steps.publish.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore rolling dataset from Cloudflare R2
        id: r2_restore
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: vienna-rail-archive
        run: node scripts/ml/archive_r2.mjs download-ubahn

      - name: Find previous dataset
        id: previous
        if: steps.r2_restore.outputs.r2_restored != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --workflow collect-ubahn-delays.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Restore previous observations
        if: steps.r2_restore.outputs.r2_restored != 'true' && steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: ubahn-delay-data
          path: data/ml
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Import five-minute Worker snapshots into the training rows
        run: node scripts/ml/import_worker_snapshots.mjs

      - name: Import official historical U-Bahn incidents
        run: node scripts/ml/sync_ubahn_incidents.mjs

      - name: Collect one Wiener Linien snapshot
        env:
          # Route collection through the Cloudflare edge proxy. Direct GitHub
          # runner requests are intermittently rejected with HTTP 403.
          VIENNA_API_BASE: https://vienna-rail-advisor.vienna-u-bahn-live-map.workers.dev
        run: node scripts/ml/collect_ubahn_delays.mjs

      - name: Archive weather labels for model joins
        continue-on-error: true
        run: node scripts/ml/collect_context_labels.mjs

      - name: Archive Vienna traffic and event context for model joins
        continue-on-error: true
        env:
          VIENNA_API_BASE: https://vienna-rail-advisor.vienna-u-bahn-live-map.workers.dev
        run: node scripts/ml/collect_mobility_context.mjs

      # Archive the newly collected labels before expensive model comparison.
      # A slow trainer must not hold the long-term R2 history hostage.
      - name: Archive observations to Cloudflare R2
        id: r2_archive
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: vienna-rail-archive
        run: node scripts/ml/archive_r2.mjs upload-ubahn

      - name: Train preliminary or validated model with a chronological holdout
        env:
          DELAY_MODEL_PATH: data/ml/candidate-model.json
          DELAY_METRICS_PATH: data/ml/candidate-metrics.json
        run: node scripts/ml/train_delay_model.mjs

      - name: Train operational model registry and label-readiness report
        env:
          OPERATIONAL_MODELS_PATH: data/ml/operational-models.json
        run: node scripts/ml/train_operational_models.mjs

      - name: Check collection freshness and source completeness
        run: node scripts/ml/collect_data_quality.mjs

      - name: Validate operational candidates on a chronological holdout
        env:
          OPERATIONAL_MODELS_PATH: data/ml/operational-models.json
          OPERATIONAL_VALIDATION_PATH: data/ml/operational-validation.json
        run: node scripts/ml/validate_operational_models.mjs

      - name: Archive dated model and validation reports to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: vienna-rail-archive
        run: node scripts/ml/archive_r2.mjs upload-model

      - name: Publish daily progress or a new online-model stage
        id: publish
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          today="$(date -u +%F)"
          previous_day="$(cat data/ml/last-published-day.txt 2>/dev/null || true)"
          candidate_online_status="$(node -p "require('./data/ml/candidate-model.json').onlineCalibration?.status || 'missing'")"
          published_online_status="$(node -p "require('./public/ml/delay-model.json').onlineCalibration?.status || 'missing'")"
          candidate_validation_stage="$(node -p "require('./data/ml/candidate-model.json').validationStage || require('./data/ml/candidate-model.json').status || 'missing'")"
          published_validation_stage="$(node -p "require('./public/ml/delay-model.json').validationStage || require('./public/ml/delay-model.json').status || 'missing'")"
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$today" != "$previous_day" ] || [ "$candidate_online_status" != "$published_online_status" ] || [ "$candidate_validation_stage" != "$published_validation_stage" ]; then
            mkdir -p public/ml
            cp data/ml/candidate-model.json public/ml/delay-model.json
            cp data/ml/candidate-metrics.json public/ml/delay-metrics.json
            cp data/ml/operational-models.json public/ml/operational-models.json
            cp data/ml/operational-validation.json public/ml/operational-validation.json
            cp data/ml/collection-health.json public/ml/collection-health.json
            cp data/ml/data-quality.json public/ml/data-quality.json
            echo "$today" > data/ml/last-published-day.txt
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save observations for the next run
        uses: actions/upload-artifact@v7
        with:
          name: ubahn-delay-data
          path: data/ml
          retention-days: 7
          compression-level: 9

      - name: Record collection health
        if: always()
        run: |
          {
            echo "## U-Bahn collection health"
            if [ -f data/ml/collection-health.json ]; then
              echo '```json'
              cat data/ml/collection-health.json
              echo '```'
            else
              echo "No collector health report was produced."
            fi
            echo "R2 archive step: ${{ steps.r2_archive.outcome }}"
            if [ -f data/ml/data-quality.json ]; then
              echo '```json'
              cat data/ml/data-quality.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit public model report
        if: steps.publish.outputs.changed == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/ml/delay-model.json public/ml/delay-metrics.json public/ml/operational-models.json public/ml/operational-validation.json public/ml/collection-health.json public/ml/data-quality.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update U-Bahn delay model report"
          # The Worker/site may have advanced main while this long-running
          # collection job trained. Replay only the report commit on top of
          # the latest main before publishing; never force-push it.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1


  deploy_report:
    needs: collect_and_train
    if: needs.collect_and_train.outputs.publish_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the report commit
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build website with the new report
        run: npx vite build
        env:
          GITHUB_PAGES: 'true'
          VITE_VIENNA_API_BASE: https://vienna-rail-advisor.vienna-u-bahn-live-map.workers.dev
          VITE_ENABLE_AI_ADVISOR: 'false'
          VITE_ADVISOR_API_URL: ${{ vars.EXTERNAL_ADVISOR_API_URL }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 600000
