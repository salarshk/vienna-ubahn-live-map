name: Archive weekly ÖBB train-run and infrastructure data

on:
  schedule:
    - cron: '20 3 * * 0'
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download and normalize accepted ÖBB resources
        env:
          OEBB_ZUGFAHRTEN_URL: ${{ secrets.OEBB_ZUGFAHRTEN_URL }}
          OEBB_NETEX_URL: ${{ secrets.OEBB_NETEX_URL }}
        run: node scripts/ml/ingest_oebb_open_data.mjs

      - name: Archive ÖBB data to Cloudflare R2
        id: r2_archive
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: vienna-rail-archive
        run: node scripts/ml/archive_r2.mjs upload-oebb

      - name: Save the dated ÖBB archive
        uses: actions/upload-artifact@v7
        with:
          name: oebb-open-data-${{ github.run_id }}
          path: data/ml/oebb
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      - name: Record ÖBB collection health
        if: always()
        run: |
          {
            echo "## ÖBB collection health"
            if [ -f data/ml/oebb/collection-health.json ]; then
              echo '```json'
              cat data/ml/oebb/collection-health.json
              echo '```'
            else
              echo "No ÖBB collection health report was produced."
            fi
            echo "R2 archive step: ${{ steps.r2_archive.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
