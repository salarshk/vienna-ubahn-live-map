<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
  <title id="title">Vienna Rail app icon concepts</title>
  <desc id="desc">Twenty numbered visual concepts for a Vienna Rail live transport app icon.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18243b"/><stop offset="1" stop-color="#0d1425"/></linearGradient>
    <linearGradient id="vienna" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e53935"/><stop offset="1" stop-color="#a80020"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1500" height="1120" fill="#080d18"/>
  <text x="50" y="48" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Vienna Rail · app icon concepts</text>
  <text x="50" y="77" fill="#94a5c3" font-family="Inter,Arial,sans-serif" font-size="15">Twenty directions for a recognizable live rail intelligence mark</text>

  <!-- 1 Roundel + train -->
  <g transform="translate(50 105)"><rect width="260" height="235" rx="22" fill="url(#tile)" stroke="#273756"/><circle cx="130" cy="105" r="66" fill="url(#vienna)" filter="url(#shadow)"/><circle cx="130" cy="105" r="45" fill="#fff"/><rect x="91" y="80" width="78" height="55" rx="11" fill="#222a3b"/><rect x="100" y="89" width="26" height="18" rx="4" fill="#65d7ff"/><rect x="134" y="89" width="26" height="18" rx="4" fill="#65d7ff"/><circle cx="108" cy="137" r="6" fill="#ffd166"/><circle cx="152" cy="137" r="6" fill="#ffd166"/><text x="18" y="211" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">1 · Vienna roundel train</text></g>
  <!-- 2 Flag + rail -->
  <g transform="translate(330 105)"><rect width="260" height="235" rx="22" fill="url(#tile)" stroke="#273756"/><rect x="57" y="49" width="146" height="112" rx="16" fill="#fff" filter="url(#shadow)"/><rect x="57" y="49" width="146" height="37" rx="16" fill="#e53935"/><rect x="57" y="124" width="146" height="37" rx="0" fill="#e53935"/><path d="M86 151L174 60M105 161L193 70" stroke="#202a3f" stroke-width="8"/><circle cx="130" cy="105" r="13" fill="#ffd166"/><text x="18" y="211" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">2 · Flag with rail lines</text></g>
  <!-- 3 Map pin train -->
  <g transform="translate(610 105)"><rect width="260" height="235" rx="22" fill="url(#tile)" stroke="#273756"/><path d="M130 45C82 45 55 80 55 120c0 54 75 94 75 94s75-40 75-94c0-40-27-75-75-75Z" fill="#00a9c7" filter="url(#shadow)"/><circle cx="130" cy="111" r="47" fill="#0d1729"/><rect x="98" y="91" width="64" height="43" rx="9" fill="#f6f8ff"/><rect x="105" y="98" width="21" height="13" rx="3" fill="#00a9c7"/><rect x="134" y="98" width="21" height="13" rx="3" fill="#00a9c7"/><circle cx="112" cy="137" r="5" fill="#ffb74d"/><circle cx="148" cy="137" r="5" fill="#ffb74d"/><text x="18" y="211" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">3 · Map pin train</text></g>
  <!-- 4 Tunnel -->
  <g transform="translate(890 105)"><rect width="260" height="235" rx="22" fill="url(#tile)" stroke="#273756"/><path d="M63 164V115a67 67 0 0 1 134 0v49" fill="none" stroke="#dce7ff" stroke-width="18"/><path d="M88 164v-48a42 42 0 0 1 84 0v48" fill="#0c1424" stroke="#ffb74d" stroke-width="7"/><path d="M113 164v-42a17 17 0 0 1 34 0v42" fill="#e53935"/><path d="M48 169h164" stroke="#fff" stroke-width="8"/><text x="18" y="211" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">4 · U-Bahn tunnel</text></g>
  <!-- 5 Train + live dot -->
  <g transform="translate(1170 105)"><rect width="260" height="235" rx="22" fill="url(#tile)" stroke="#273756"/><rect x="75" y="60" width="110" height="104" rx="22" fill="#26344f" filter="url(#shadow)"/><rect x="88" y="76" width="36" height="24" rx="5" fill="#66dcff"/><rect x="136" y="76" width="36" height="24" rx="5" fill="#66dcff"/><path d="M91 121h78" stroke="#f6f8ff" stroke-width="8"/><circle cx="100" cy="155" r="9" fill="#ffd166"/><circle cx="160" cy="155" r="9" fill="#ffd166"/><circle cx="190" cy="58" r="15" fill="#4caf50" stroke="#fff" stroke-width="5"/><text x="18" y="211" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">5 · Live train location</text></g>

  <!-- 6 Network nodes -->
  <g transform="translate(50 370)"><rect width="260" height="235" rx="22" fill="url(#tile)" stroke="#273756"/><path d="M75 87L130 55l65 40-19 70-73 0Z" fill="none" stroke="#65d7ff" stroke-width="8"/><path d="M75 87l28 78M195 95l-92 70M130 55l-27 110" stroke="#ffb74d" stroke-width="6"/><g fill="#fff" stroke="#e53935" stroke-width="5"><circle cx="75" cy="87" r="11"/><circle cx="130" cy="55" r="11"/><circle cx="195" cy="95" r="11"/><circle cx="103" cy="165" r="11"/><circle cx="176" cy="165" r="11"/></g><text x="18" y="211" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">6 · Interchange network</text></g>
  <!-- 7 V tracks -->
  <g transform="translate(330 370)"><rect width="260" height="235" rx="22" fill="url(#tile)" stroke="#273756"/><path d="M74 66l56 111 56-111M96 66l34 70 34-70" fill="none" stroke="#ffd166" stroke-width="11" stroke-linecap="round"/><path d="M61 67h26M174 67h26" stroke="#e53935" stroke-width="8"/><circle cx="130" cy="177" r="15" fill="#00b4d8"/><text x="18" y="211" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">7 · V-shaped rail mark</text></g>
  <!-- 8 Skyline rail -->
  <g transform="translate(610 370)"><rect width="260" height="235" rx="22" fill="url(#tile)" stroke="#273756"/><path d="M55 155h150M65 155V105h22v50m13 0V80h26v75m17 0V116h22v39m15 0V91h22v64" fill="#dce7ff"/><path d="M55 176c34-21 66-21 100 0s66 21 100 0" fill="none" stroke="#e53935" stroke-width="9"/><circle cx="86" cy="164" r="8" fill="#ffd166"/><circle cx="174" cy="164" r="8" fill="#00b4d8"/><text x="18" y="211" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">8 · Vienna skyline rail</text></g>
  <!-- 9 Cathedral -->
  <g transform="translate(890 370)"><rect width="260" height="235" rx="22" fill="url(#tile)" stroke="#273756"/><path d="M130 52l31 44v73H99V96Z" fill="#e9eef8" filter="url(#shadow)"/><path d="M130 52V34l7 18 9-12-2 24M105 111h50M105 132h50" stroke="#e53935" stroke-width="7" fill="none"/><path d="M61 179h138" stroke="#ffd166" stroke-width="9"/><circle cx="88" cy="169" r="9" fill="#00b4d8"/><circle cx="172" cy="169" r="9" fill="#4caf50"/><text x="18" y="211" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">9 · Stephansdom + rail</text></g>
  <!-- 10 Circular network -->
  <g transform="translate(1170 370)"><rect width="260" height="235" rx="22" fill="url(#tile)" stroke="#273756"/><circle cx="130" cy="110" r="67" fill="none" stroke="#e53935" stroke-width="10"/><circle cx="130" cy="110" r="43" fill="none" stroke="#00b4d8" stroke-width="9"/><path d="M130 43v134M63 110h134" stroke="#ffd166" stroke-width="7"/><circle cx="130" cy="110" r="15" fill="#fff"/><text x="18" y="211" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">10 · Circular metro network</text></g>

  <!-- 11 Bell train -->
  <g transform="translate(50 635)"><rect width="260" height="235" rx="22" fill="url(#tile)" stroke="#273756"/><path d="M83 126h94l-12-18V91a35 35 0 0 0-70 0v17Z" fill="#ffb74d" filter="url(#shadow)"/><circle cx="130" cy="139" r="8" fill="#fff"/><path d="M102 157h56" stroke="#ffb74d" stroke-width="8" stroke-linecap="round"/><rect x="100" y="163" width="60" height="27" rx="7" fill="#e53935"/><circle cx="115" cy="194" r="6" fill="#ffd166"/><circle cx="145" cy="194" r="6" fill="#ffd166"/><text x="18" y="211" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">11 · Alert bell + train</text></g>
  <!-- 12 Arrow route -->
  <g transform="translate(330 635)"><rect width="260" height="235" rx="22" fill="url(#tile)" stroke="#273756"/><path d="M71 153c32-80 56-80 90-20 17 30 33 29 57-23" fill="none" stroke="#65d7ff" stroke-width="10" stroke-linecap="round"/><path d="M194 99l27 11-22 20" fill="none" stroke="#65d7ff" stroke-width="10"/><circle cx="71" cy="153" r="12" fill="#e53935"/><circle cx="130" cy="133" r="12" fill="#ffd166"/><circle cx="218" cy="110" r="12" fill="#4caf50"/><text x="18" y="211" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">12 · Live route arrow</text></g>
  <!-- 13 Compass metro -->
  <g transform="translate(610 635)"><rect width="260" height="235" rx="22" fill="url(#tile)" stroke="#273756"/><circle cx="130" cy="112" r="65" fill="none" stroke="#dce7ff" stroke-width="7"/><path d="M130 55v114M73 112h114" stroke="#ffb74d" stroke-width="5"/><path d="M130 71l15 41-15 41-15-41Z" fill="#e53935"/><circle cx="130" cy="112" r="10" fill="#00b4d8"/><text x="18" y="211" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">13 · Compass + metro</text></g>
  <!-- 14 Bolt rail -->
  <g transform="translate(890 635)"><rect width="260" height="235" rx="22" fill="url(#tile)" stroke="#273756"/><path d="M145 47L91 122h36l-12 61 58-84h-36Z" fill="#ffd166" filter="url(#shadow)"/><path d="M61 189h138" stroke="#65d7ff" stroke-width="8"/><circle cx="91" cy="189" r="8" fill="#e53935"/><circle cx="169" cy="189" r="8" fill="#4caf50"/><text x="18" y="211" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">14 · Live-data lightning</text></g>
  <!-- 15 Minimal red train -->
  <g transform="translate(1170 635)"><rect width="260" height="235" rx="22" fill="#f7f9ff" stroke="#273756"/><rect x="72" y="63" width="116" height="101" rx="25" fill="#e53935" filter="url(#shadow)"/><rect x="88" y="81" width="38" height="28" rx="6" fill="#fff"/><rect x="134" y="81" width="38" height="28" rx="6" fill="#fff"/><path d="M90 130h80" stroke="#fff" stroke-width="8"/><circle cx="100" cy="161" r="8" fill="#222a3b"/><circle cx="160" cy="161" r="8" fill="#222a3b"/><text x="18" y="211" fill="#17233a" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">15 · Minimal red train</text></g>

  <!-- 16 Triangle stations -->
  <g transform="translate(50 900)"><rect width="260" height="170" rx="22" fill="url(#tile)" stroke="#273756"/><path d="M130 37L72 124h116Z" fill="none" stroke="#dce7ff" stroke-width="7"/><circle cx="130" cy="37" r="13" fill="#e53935"/><circle cx="72" cy="124" r="13" fill="#00b4d8"/><circle cx="188" cy="124" r="13" fill="#ffd166"/><text x="18" y="151" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">16 · Three-station triangle</text></g>
  <!-- 17 VR monogram -->
  <g transform="translate(330 900)"><rect width="260" height="170" rx="22" fill="url(#tile)" stroke="#273756"/><text x="56" y="112" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="78" font-weight="800">VR</text><path d="M55 128h151M74 143h112" stroke="#e53935" stroke-width="6"/><circle cx="72" cy="128" r="7" fill="#ffd166"/><circle cx="190" cy="128" r="7" fill="#00b4d8"/><text x="18" y="151" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">17 · VR rail monogram</text></g>
  <!-- 18 Shield map -->
  <g transform="translate(610 900)"><rect width="260" height="170" rx="22" fill="url(#tile)" stroke="#273756"/><path d="M130 30l68 22v43c0 35-24 59-68 75-44-16-68-40-68-75V52Z" fill="#263d66" stroke="#65d7ff" stroke-width="6"/><path d="M87 101l36-41 25 42 27-23" fill="none" stroke="#ffd166" stroke-width="7"/><circle cx="87" cy="101" r="8" fill="#e53935"/><circle cx="175" cy="79" r="8" fill="#4caf50"/><text x="18" y="151" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">18 · Rail network shield</text></g>
  <!-- 19 Radar -->
  <g transform="translate(890 900)"><rect width="260" height="170" rx="22" fill="url(#tile)" stroke="#273756"/><circle cx="130" cy="88" r="55" fill="none" stroke="#4caf50" stroke-width="5"/><circle cx="130" cy="88" r="34" fill="none" stroke="#4caf50" stroke-width="5"/><path d="M130 88L178 60" stroke="#ffd166" stroke-width="7"/><circle cx="178" cy="60" r="10" fill="#e53935"/><rect x="112" y="106" width="36" height="20" rx="4" fill="#65d7ff"/><text x="18" y="151" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">19 · Train radar</text></g>
  <!-- 20 Train from pin -->
  <g transform="translate(1170 900)"><rect width="260" height="170" rx="22" fill="url(#tile)" stroke="#273756"/><path d="M130 36c-35 0-57 24-57 54 0 34 57 66 57 66s57-32 57-66c0-30-22-54-57-54Z" fill="#e53935"/><rect x="98" y="62" width="64" height="43" rx="8" fill="#f6f8ff"/><rect x="105" y="69" width="21" height="13" rx="3" fill="#00b4d8"/><rect x="134" y="69" width="21" height="13" rx="3" fill="#00b4d8"/><circle cx="112" cy="108" r="5" fill="#ffd166"/><circle cx="148" cy="108" r="5" fill="#ffd166"/><text x="18" y="151" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">20 · Train from pin</text></g>
</svg>
