<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Vienna rail live map">
  <!-- An interchange: three Lines crossing, one Station drawn on top of them.
       The palette is this network's own (src/data/line_colors_from_image.json) —
       line 3 red, line 1 yellow, line 5 green — rather than Metrovalencia's
       official mark, which is a trademark and not ours to ship.
       The Station is drawn the way the map itself draws one: a white centre in a
       dark ring. The ring is kept small deliberately, so the Lines read as
       passing through the Station rather than stopping at it. -->
  <rect width="64" height="64" rx="14" fill="#16161f"/>
  <g fill="none" stroke-linecap="round" stroke-width="7.5">
    <path stroke="#E2001A" d="M11 53 L 53 11"/>
    <path stroke="#FFD100" d="M9 32 H 55"/>
    <path stroke="#00994D" d="M11 11 L 53 53"/>
  </g>
  <circle cx="32" cy="32" r="10" fill="#16161f"/>
  <circle cx="32" cy="32" r="6.5" fill="#fff"/>
</svg>
